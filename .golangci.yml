# DO NOT EDIT THIS FILE. Only the maintainers should modify it.
version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    # Deprecated linters
    - wsl
    - gomodguard
    - exhaustruct
    # Disabled due to project policy
    - testpackage
  settings:
    paralleltest:
      ignore-missing: false
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - "github.com/KEINOS/go-filehashcache"
            - "github.com/stretchr/testify"
            - "go.yaml.in/yaml/v3"
    varnamelen:
      ignore-names:
        - ok
        - t
        - tt
