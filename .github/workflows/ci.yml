name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            _examples/basic/go.sum
      - name: Build packages
        run: go build ./...
      - name: Test packages
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Test example module
        run: go -C _examples/basic test -race ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            _examples/basic/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Check modules
        run: |
          go mod tidy
          go -C _examples/basic mod tidy
          git diff --exit-code
      - name: Run go vet
        run: |
          go vet ./...
          go -C _examples/basic vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m
      - name: Run golangci-lint for example module
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.1
          working-directory: _examples/basic
          args: --config=../../.golangci.yml --timeout=5m
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
  docker:
    name: Docker Linux test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test target
        run: docker build --target test .
